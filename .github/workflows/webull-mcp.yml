name: Webull MCP

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "mcp/webull/**"
      - ".github/workflows/webull-mcp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/webull
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Tests (mock mode, no credentials)
        env:
          WEBULL_BACKEND: mock
          WEBULL_DRY_RUN: "true"
        run: python -m pytest

      - name: Brand lock
        working-directory: .
        run: |
          set -euo pipefail
          if git grep -IiqE '\b(joe|joey|lacy|jhlacy|joeylazy)\b' -- mcp README.md; then
            echo "Brand lock failed: personal-name token found"
            exit 1
          fi
          echo "Brand lock OK"
