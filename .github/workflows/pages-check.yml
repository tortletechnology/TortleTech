name: Pages site check

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble and verify public site
        run: |
          set -euo pipefail
          mkdir -p _site/redactor _site/games
          cp index.html 404.html .nojekyll _site/
          cp redactor/index.html _site/redactor/index.html
          cp -R games/hot-dog-rush _site/games/hot-dog-rush
          test -f _site/index.html
          test -f _site/redactor/index.html
          test -f _site/games/hot-dog-rush/index.html
          test -f _site/games/hot-dog-rush/vendor/three.module.min.js
          grep -F -q 'Hot Dog Rush' _site/games/hot-dog-rush/index.html
          grep -F -q 'viewport-fit=cover' _site/games/hot-dog-rush/index.html
          node --check games/hot-dog-rush/stand.js
          node --check games/hot-dog-rush/stand-logic.js
          node --test games/hot-dog-rush/stand-logic.test.js
          grep -F -q 'https://buy.stripe.com/5kQ14m2GL6sWeAB7n3gnK03' _site/redactor/index.html
          grep -F -q 'var STRIPE_PAYMENT_LINK' _site/redactor/index.html
          node --test games/hot-dog-rush/logic.test.js
          node --check games/hot-dog-rush/main.js
          node --check games/hot-dog-rush/view.js
          if grep -RIiqE '\b(joe|joey|lacy|jhlacy|joeylazy)\b' index.html 404.html README.md redactor mcp; then
            echo "Brand lock failed: personal-name token found"
            exit 1
          fi
          echo "Site assemble OK — /redactor/ ready"
