<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — TortleTech</title>
  <meta name="robots" content="noindex" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      background: #070b14;
      color: #eef3fb;
      text-align: center;
      padding: 1.5rem;
    }
    a { color: #4f8cff; }
    p { color: #92a0b8; }
  </style>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>That path isn’t on the TortleTech site.</p>
    <p><a id="link-home" href="/TortleTech/">Home</a> · <a id="link-redactor" href="/TortleTech/redactor/">Redactor</a></p>
    <script>
      (function () {
        var pages = /github\.io$/i.test(location.hostname);
        var home = pages ? "/TortleTech/" : "/";
        var app = pages ? "/TortleTech/redactor/" : "/redactor/";
        var a = document.getElementById("link-home");
        var b = document.getElementById("link-redactor");
        if (a) a.setAttribute("href", home);
        if (b) b.setAttribute("href", app);
      })();
    </script>
  </div>
</body>
</html>
